# Render Blueprint: the game server (Colyseus). The website is deployed separately (Cloudflare Pages).
services:
  - type: web
    name: blackout-protocol-server
    runtime: node
    plan: free # sleeps after 15 min idle (~1 min wake-up). Switch to "starter" ($7/mo) for always-on.
    region: oregon
    buildCommand: npm ci && npm run build --workspace server
    startCommand: npm run start --workspace server
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Comma-separated list of website origins allowed to connect, e.g. https://blackout.pages.dev
      # Render asks for this value when you create the Blueprint. Use * until the site exists.
      - key: ALLOWED_ORIGINS
        sync: false
