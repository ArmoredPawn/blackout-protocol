# Render Blueprint: game server (Colyseus). The frontend is deployed separately (Cloudflare Pages).
services:
  - type: web
    name: blackout-protocol-server
    runtime: node
    plan: starter # $7/mo, no sleeping. Use "free" for testing (sleeps after 15 min idle, ~1 min cold start).
    region: oregon
    buildCommand: npm ci && npm run build --workspace server
    startCommand: npm run start --workspace server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ALLOWED_ORIGINS
        value: https://your-site.pages.dev # comma-separated list of frontend origins
